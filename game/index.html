<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2b3c; font-family: Verdana, Geneva, sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; text-align: center; }
  #start { background: linear-gradient(180deg, rgba(16,42,64,.82), rgba(214,120,60,.55)); color: #fff7e8; cursor: pointer; }
  #start h1 { font-size: 64px; margin: 0 0 6px; letter-spacing: 4px; text-shadow: 0 4px 0 #b3502e, 0 8px 24px rgba(0,0,0,.5); }
  #start p { margin: 4px 0; font-size: 17px; }
  #start .go { margin-top: 22px; background: #ffb347; color: #40260d; padding: 12px 34px; border-radius: 24px; font-weight: bold; font-size: 20px; }
  #busted, #wasted { display: none; background: rgba(10,10,16,.72); color: #fff; }
  #busted h1 { color: #7db4ff; font-size: 56px; letter-spacing: 6px; margin: 0 0 10px; }
  #wasted h1 { color: #ff6b5e; font-size: 56px; letter-spacing: 6px; margin: 0 0 10px; }
  .overlay button { background: #ffb347; border: 0; color: #40260d; padding: 12px 32px; border-radius: 22px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 14px; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; color: #fff; }
  #topbar { position: absolute; top: 10px; right: 14px; text-align: right; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
  #cash { font-size: 26px; font-weight: bold; color: #9fe870; }
  #stars { font-size: 22px; color: #ffd94d; letter-spacing: 3px; min-height: 26px; }
  #ammo { font-size: 15px; color: #ffe9c9; }
  #vitals { position: absolute; top: 10px; left: 14px; width: 210px; }
  .bar { height: 13px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5); border-radius: 6px; overflow: hidden; margin-bottom: 5px; }
  .bar i { display: block; height: 100%; }
  #healthfill { background: #e84f3d; width: 100%; }
  #armourfill { background: #5ea8e8; width: 0%; }
  .barlabel { font-size: 11px; text-shadow: 0 1px 3px #000; letter-spacing: 1px; }
  #banner { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); max-width: 70%; text-align: center; font-size: 19px; font-weight: bold; color: #fff3d6; text-shadow: 0 2px 6px rgba(0,0,0,.85); background: rgba(20,26,34,.45); padding: 8px 18px; border-radius: 10px; }
  #prompt { position: absolute; bottom: 118px; left: 50%; transform: translateX(-50%); font-size: 17px; color: #ffe9b0; text-shadow: 0 2px 5px #000; background: rgba(20,26,34,.5); padding: 7px 16px; border-radius: 9px; white-space: nowrap; }
  #bustwrap { position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%); width: 240px; display: none; }
  #bustwrap .barlabel { text-align: center; color: #9ec7ff; }
  #bustfill { background: #5ea8e8; width: 0%; }
  #minimap { position: absolute; bottom: 12px; left: 12px; width: 176px; height: 176px; border: 2px solid rgba(255,255,255,.55); border-radius: 10px; background: rgba(14,30,44,.85); }
  #toast { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); font-size: 16px; color: #c9f7c0; text-shadow: 0 2px 5px #000; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="vitals">
    <div class="barlabel">HEALTH</div>
    <div class="bar"><i id="healthfill"></i></div>
    <div class="barlabel">ARMOUR</div>
    <div class="bar"><i id="armourfill"></i></div>
  </div>
  <div id="topbar">
    <div id="cash">$120</div>
    <div id="stars"></div>
    <div id="ammo">PISTOL 12 / 24</div>
  </div>
  <div id="banner">Welcome to Solmar Bay</div>
  <div id="bustwrap"><div class="barlabel">BUSTED</div><div class="bar"><i id="bustfill"></i></div></div>
  <div id="toast"></div>
  <div id="prompt"></div>
  <canvas id="minimap" width="176" height="176"></canvas>
</div>
<div id="start" class="overlay">
  <h1>SOLMAR BAY</h1>
  <p>Rico drives. Marisol Vega pays. The bay provides.</p>
  <p>WASD move &middot; E enter car &middot; F shoot &middot; Shift sprint</p>
  <div class="go">CLICK TO PLAY</div>
</div>
<div id="busted" class="overlay">
  <h1>BUSTED</h1>
  <p id="bustedtext">The Solmar Bay PD got you.</p>
  <button id="bustedbtn">Continue</button>
</div>
<div id="wasted" class="overlay">
  <h1>WASTED</h1>
  <p id="wastedtext">You wake up at Solmar General.</p>
  <button id="wastedbtn">Continue</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
